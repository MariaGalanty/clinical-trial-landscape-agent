[project]
name = "clinial-trial-landscape-agent"
version = "0.1.0"
description = "Evidence-grounded clinical trial landscape for a disease, with cited per-trial and per-drug summaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1.1",
    "tavily-python>=0.8.5",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "pytest>=9.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The modules in src/ are installed into the environment (editable),
# so scripts/ and tests/ can import them: `from registry import ...`
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "registry", "pubmed", "drug", "schemas", "summarise", "llm_log",
    "report", "web", "trial_agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
