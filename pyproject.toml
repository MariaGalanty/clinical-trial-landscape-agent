[project]
name = "clinial-trial-landscape-agent"
version = "0.1.0"
description = "Evidence-grounded clinical trial landscape for a disease, with cited per-trial and per-drug summaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
]
